name: M1 -> M2a Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pytest.ini'
      - '.github/workflows/integration_tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pytest.ini'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-test.txt

      - name: Verify integration test framework
        run: |
          python verify_integration_tests.py

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=runtime \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration-tests
          name: codecov-integration-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports-py${{ matrix.python-version }}
          path: htmlcov/

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results.xml
          check_name: Integration Tests (Python ${{ matrix.python-version }})

  test-coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest tests/integration/ \
            --cov=runtime \
            --cov=tests \
            --cov-report=term-missing:skip-covered \
            --cov-report=html \
            --cov-branch

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Run Bandit security checks
        run: |
          bandit -r runtime tests -f json -o bandit-report.json || true

      - name: Check for vulnerable dependencies
        run: |
          safety check --json || true

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [integration-tests, test-coverage, security-checks]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [ "${{ needs.test-coverage.result }}" != "success" ]; then
            echo "Coverage analysis failed"
            exit 1
          fi
          echo "All checks passed successfully!"
