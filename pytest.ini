[pytest]
# PyTest Configuration for M1 -> M2a Integration Tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: Integration tests for M1->M2a flow
    happy_path: Happy path (success) scenarios
    permission_denial: Permission denial scenarios
    quota: Quota limitation scenarios
    replay: Replay protection scenarios
    audit: Audit trail scenarios
    slow: Slow running tests
    requires_fixture: Tests that require fixture data

# Coverage options
addopts =
    --strict-markers
    --tb=short
    --cov=runtime
    --cov=tests
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    -v

# Timeout (in seconds)
timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 7.0
